<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Inter Tight"; src: url("../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Inter"; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", sans-serif; color: #fff;
        background: radial-gradient(ellipse at top left, #184e6c 0%, #0f3349 45%, #0b2436 100%); position: relative; }
      .grade { position: absolute; inset: 0; opacity: .12;
        background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
        background-size: 56px 56px; mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%); }
      .caixa { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
      .logo { display: inline-flex; align-items: center; background: #fff; border-radius: 18px; padding: 14px 22px; width: max-content; }
      .logo img { height: 64px; }
      h1 { font-family: "Inter Tight", sans-serif; font-weight: 800; font-size: 76px; line-height: .95; letter-spacing: -.035em; text-transform: uppercase; max-width: 1000px; }
      h1 span { color: #2790d2; }
      p { font-size: 28px; line-height: 1.35; color: #c6d8e4; max-width: 900px; margin-top: 22px; }
      ul { list-style: none; display: flex; gap: 12px; padding: 0; }
      li { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
        border-radius: 999px; padding: 10px 18px; font-size: 22px; font-weight: 600; }
      li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #35cc62; }
      .faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #0075be, #2790d2, #35cc62); }
    </style>
  </head>
  <body>
    <div class="grade"></div>
    <div class="caixa">
      <div class="logo"><img src="../public/marca/nucleo-i9-horizontal.svg" alt="Núcleo i9" /></div>
      <div>
        <h1>Tudo que sua equipe de vendas precisa, <span>num lugar só.</span></h1>
        <p>WhatsApp pela API oficial, CRM, funil de vendas, Agentes iA e contratos.</p>
      </div>
      <ul>
        <li>Acesso em minutos</li>
        <li>Usuários ilimitados</li>
        <li>Sem fidelidade</li>
      </ul>
    </div>
    <div class="faixa"></div>
  </body>
</html>
